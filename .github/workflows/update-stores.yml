name: 店舗データ更新

on:
  schedule:
    # 1・4・7・10月の2日 6:17（日本時間）
    - cron: "17 21 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      prefs:
        description: "収集する都道府県（空欄なら定期更新の対象県。例：大阪府 京都府）"
        required: false
        default: ""
      codes:
        description: "更新する銘柄コード（空欄なら全社。複数はスペース区切り）"
        required: false
        default: ""
  push:
    paths:
      - "scripts/stores/**"
      - ".github/workflows/update-stores.yml"

permissions:
  contents: write

concurrency:
  group: update-stores-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 店舗を収集
        env:
          PREFS: ${{ github.event.inputs.prefs }}
        run: python3 scripts/stores/collect.py ${{ github.event.inputs.codes }}
      - name: 地下鉄路線を取得
        run: python3 scripts/stores/subway.py
      - name: 変更をコミット
        # 作業ブランチでは収集結果の確認だけ行い、コミットはmainのみ（マージ時の衝突を防ぐ）
        if: github.ref_name == github.event.repository.default_branch
        run: |
          if [ -z "$(git status --porcelain -- stores.json stores_changes.md subway.geojson)" ]; then
            echo "変更なし"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add stores.json stores_changes.md; [ -f subway.geojson ] && git add subway.geojson
          git commit -m "店舗データ更新 $(date +%Y-%m-%d)" -m "$(head -n 4 stores_changes.md | tail -n 2)"
          # 実行中に別のコミットが入っても失敗しないよう、最新を取り込んでからpush
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            sleep 5
          done
