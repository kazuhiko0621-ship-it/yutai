name: 店舗データ更新

on:
  schedule:
    # 1・4・7・10月の2日 6:17（日本時間）
    - cron: "17 21 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      codes:
        description: "更新する銘柄コード（空欄なら全社。複数はスペース区切り）"
        required: false
        default: ""
  push:
    paths:
      - "scripts/stores/**"

permissions:
  contents: write

concurrency:
  group: update-stores-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 店舗を収集
        run: python3 scripts/stores/collect.py ${{ github.event.inputs.codes }}
      - name: 変更をコミット
        run: |
          if git diff --quiet -- stores.json stores_changes.md; then
            echo "変更なし"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add stores.json stores_changes.md
          git commit -m "店舗データ更新 $(date +%Y-%m-%d)" -m "$(head -n 4 stores_changes.md | tail -n 2)"
          git push
